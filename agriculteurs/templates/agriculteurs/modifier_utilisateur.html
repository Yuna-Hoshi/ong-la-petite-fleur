{% extends 'agriculteurs/base.html' %}

{% block title %}Modifier l'utilisateur - La petite Fleur{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-8">

    <div class="bg-white p-6 rounded-xl shadow-sm border border-nature-100">
        <h1 class="text-2xl font-bold text-nature-700 mb-2">Modifier le membre</h1>
        <p class="text-sm text-gray-500 mb-6">Modification du rôle pour l'utilisateur : <strong class="text-gray-800">{{ user_to_edit.username }}</strong></p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-nature-600 mb-1">Rôle dans l'ONG</label>
                <select name="role" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nature-600 bg-white mb-4">
                    {% for code, libelle in roles %}
                        <option value="{{ code }}" {% if profil_to_edit.role == code %}selected{% endif %}>{{ libelle }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex space-x-4">
                <button type="submit" class="w-full bg-nature-600 hover:bg-nature-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    Enregistrer les modifications
                </button>
                <a href="{% url 'gestion_utilisateurs' %}" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-center font-semibold py-2.5 rounded-lg transition duration-200">
                    Annuler
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
